<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Ricettario di Husqui</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Noto Serif JP', serif;
        }

        /* Background pattern orientale */
        .oriental-bg {
            background: linear-gradient(135deg, #faf8f6 0%, #f5f1ea 50%, #ede5d9 100%);
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .oriental-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(217, 119, 6, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Stile header elegante */
        .header-container {
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .header-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(217, 119, 6, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(239, 68, 68, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .header-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: #faf8f6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .decorative-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #d97706, transparent);
            margin: 16px auto;
        }

        .header-subtitle {
            font-size: 1.1rem;
            color: #d4af86;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Main container */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 50px 20px;
            position: relative;
            z-index: 5;
        }

        /* Barra di ricerca elegante */
        .search-section {
            margin-bottom: 50px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #d9a880;
            font-size: 1.2rem;
            z-index: 2;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 2px solid #d9a880;
            border-radius: 8px;
            background: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .search-input:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.15);
            background: #fffbf0;
        }

        /* Titolo categorie */
        .categories-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        /* Grid categorie */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        @media (min-width: 768px) {
            .categories-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Cartelle categoria */
        .category-folder {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #fff5e6 0%, #fef0d9 100%);
            border: 2px solid #d9a880;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.1);
        }

        .category-folder::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .category-folder:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 30px rgba(217, 119, 6, 0.2);
            background: linear-gradient(135deg, #fef0d9 0%, #fee5cc 100%);
            border-color: #d97706;
        }

        .category-folder:hover::before {
            opacity: 1;
        }

        .category-folder-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #d97706;
            text-align: center;
            position: relative;
            z-index: 1;
            line-height: 1.3;
        }

        /* Recipe grid */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .recipe-card {
            background: white;
            border: 2px solid #e0d5c7;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .recipe-card:hover {
            border-color: #d97706;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.15);
            transform: translateY(-4px);
        }

        .recipe-card-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .recipe-card-category {
            font-size: 0.85rem;
            color: #d97706;
            margin-bottom: 12px;
        }

        .recipe-card-info {
            display: flex;
            gap: 8px;
            font-size: 0.85rem;
            color: #999;
            flex-wrap: wrap;
        }

        /* Bio section */
        .bio-section {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-left: 4px solid #d97706;
            border-radius: 8px;
            padding: 32px;
            max-width: 800px;
            margin: 60px auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .bio-title {
            color: #333;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .bio-subtitle {
            color: #d97706;
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .bio-content {
            color: #666;
            font-size: 1rem;
            line-height: 1.8;
        }

        .bio-placeholder {
            color: #999;
            font-style: italic;
        }

        /* Social links section */
        .social-section {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid #e0d5c7;
        }

        .social-title {
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #fff5e6 0%, #fef0d9 100%);
            border: 2px solid #d9a880;
            border-radius: 6px;
            color: #d97706;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-link:hover {
            background: linear-gradient(135deg, #fef0d9 0%, #fee5cc 100%);
            border-color: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.15);
        }

        /* Contact section */
        .contact-section {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid #e0d5c7;
            border-radius: 8px;
            padding: 32px;
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .contact-title {
            color: #333;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .contact-item {
            color: #666;
            font-size: 1rem;
        }

        .contact-item-label {
            color: #d97706;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .contact-item-value {
            color: #333;
        }

        .contact-item a {
            color: #d97706;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-item a:hover {
            color: #d97706;
            text-decoration: underline;
        }

        /* Info box */
        .info-box {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-left: 4px solid #d97706;
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .info-box-text {
            text-align: center;
            color: #555;
            font-size: 1rem;
        }

        .info-box-highlight {
            color: #d97706;
            font-weight: 600;
        }

        /* Recipe detail */
        .recipe-detail {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .back-button {
            background: #d97706;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 30px;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #c4660e;
        }

        .recipe-detail-title {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .recipe-detail-category {
            color: #d97706;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .recipe-detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .recipe-detail-item {
            background: #fff5e6;
            padding: 16px;
            border-radius: 6px;
        }

        .recipe-detail-item-label {
            color: #d97706;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .recipe-detail-item-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
        }

        .recipe-detail-notes {
            background: #fffbf0;
            border-left: 4px solid #d97706;
            padding: 16px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .recipe-detail-section {
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .recipe-detail-section-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 16px;
        }

        .recipe-ingredients {
            columns: 2;
            column-gap: 30px;
        }

        .recipe-ingredients li {
            margin-bottom: 12px;
            color: #666;
        }

        .recipe-steps ol {
            margin-bottom: 30px;
        }

        .recipe-steps li {
            margin-bottom: 16px;
            color: #666;
            line-height: 1.8;
        }

        .recipe-steps li strong {
            color: #d97706;
        }

        /* Animazioni */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title {
                font-size: 2.5rem;
            }

            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .category-folder-name {
                font-size: 0.95rem;
            }

            .header-subtitle {
                font-size: 0.95rem;
            }

            .bio-section,
            .contact-section {
                padding: 24px;
            }

            .social-links {
                flex-direction: column;
            }

            .social-link {
                width: 100%;
                justify-content: center;
            }

            .recipe-detail {
                padding: 24px;
            }

            .recipe-detail-title {
                font-size: 1.8rem;
            }

            .recipe-ingredients {
                columns: 1;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function RicettarioApp() {
            const [recipes, setRecipes] = useState([]);
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [selectedRecipe, setSelectedRecipe] = useState(null);

            // Carica ricette dal JSON
            useEffect(() => {
                fetch('ricette.json')
                    .then(res => res.json())
                    .then(data => setRecipes(data.ricette))
                    .catch(err => console.error('Errore nel caricamento ricette:', err));
            }, []);

            // Estrai categorie uniche
            const categories = [...new Set(recipes.map(r => r.category))].sort().map((cat, idx) => ({
                id: idx + 1,
                name: cat
            }));

            // Filtri ricette
            const filteredRecipes = recipes.filter(recipe => {
                const matchesSearch = recipe.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = !selectedCategory || recipe.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            return (
                <div className="oriental-bg">
                    {/* Header */}
                    <div className="header-container">
                        <div className="header-content">
                            <h1 className="header-title">IL RICETTARIO DI HUSQUI</h1>
                            <div className="decorative-line"></div>
                            <p className="header-subtitle">La raccolta delle mie migliori ricette</p>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="main-content">
                        {!selectedRecipe ? (
                            <>
                                {/* Search Bar */}
                                <div className="search-section">
                                    <div className="search-container">
                                        <span className="search-icon">🔍</span>
                                        <input
                                            type="text"
                                            placeholder="Cerca le tue ricette..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="search-input"
                                        />
                                    </div>
                                </div>

                                {/* Categories Title */}
                                <h3 className="categories-title">Le tue categorie</h3>

                                {/* Categories Grid */}
                                <div className="categories-grid">
                                    {categories.map((cat) => (
                                        <div
                                            key={cat.id}
                                            className="category-folder"
                                            onClick={() => {
                                                setSelectedCategory(selectedCategory === cat.name ? null : cat.name);
                                                setSearchTerm("");
                                            }}
                                            style={{
                                                borderColor: selectedCategory === cat.name ? '#d97706' : '#d9a880',
                                                background: selectedCategory === cat.name 
                                                    ? 'linear-gradient(135deg, #fef0d9 0%, #fee5cc 100%)'
                                                    : 'linear-gradient(135deg, #fff5e6 0%, #fef0d9 100%)'
                                            }}
                                        >
                                            <div className="category-folder-name">{cat.name}</div>
                                        </div>
                                    ))}
                                </div>

                                {/* Recipes Grid */}
                                {filteredRecipes.length > 0 && (
                                    <>
                                        <h3 className="categories-title" style={{ marginTop: '40px' }}>
                                            {searchTerm ? `Risultati per "${searchTerm}"` : selectedCategory || 'Tutte le ricette'}
                                        </h3>
                                        <div className="recipes-grid">
                                            {filteredRecipes.map((recipe) => (
                                                <div
                                                    key={recipe.id}
                                                    className="recipe-card"
                                                    onClick={() => setSelectedRecipe(recipe)}
                                                >
                                                    <div className="recipe-card-name">{recipe.name}</div>
                                                    <div className="recipe-card-category">{recipe.category}</div>
                                                    <div className="recipe-card-info">
                                                        <span>⏱️ {recipe.time}</span>
                                                        <span>📊 {recipe.difficulty}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}

                                {/* Bio Section */}
                                <div className="bio-section">
                                    <div className="bio-subtitle">Chi sono</div>
                                    <h2 className="bio-title">Marco Busetti De Luna</h2>
                                    <div className="bio-content">
                                        <p className="bio-placeholder">
                                            [Aggiungerai qui la tua biografia quando avrai tempo]
                                        </p>
                                    </div>
                                    
                                    <div className="social-section">
                                        <h3 className="social-title">Seguimi sui social</h3>
                                        <div className="social-links">
                                            <a href="#" className="social-link">
                                                📱 Instagram
                                            </a>
                                            <a href="#" className="social-link">
                                                👥 Facebook
                                            </a>
                                        </div>
                                    </div>
                                </div>

                                {/* Contact Section */}
                                <div className="contact-section">
                                    <h2 className="contact-title">Contatti</h2>
                                    <div className="contact-info">
                                        <div className="contact-item">
                                            <span className="contact-item-label">Email</span>
                                            <span className="contact-item-value">
                                                <a href="mailto:busetti.marco@hotmail.it">busetti.marco@hotmail.it</a>
                                            </span>
                                        </div>
                                        <div className="contact-item">
                                            <span className="contact-item-label">Telefono</span>
                                            <span className="contact-item-value">
                                                <a href="tel:+393923511431">+39 392 351 1431</a>
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* Info Box */}
                                <div className="info-box">
                                    <p className="info-box-text">
                                        <span className="info-box-highlight">✨ Benvenuto nel ricettario</span>
                                        <br />
                                        Usa la barra di ricerca per trovare le tue ricette oppure clicca su una categoria per esplorare
                                    </p>
                                </div>
                            </>
                        ) : (
                            /* Recipe Detail */
                            <div className="recipe-detail">
                                <button 
                                    onClick={() => setSelectedRecipe(null)}
                                    className="back-button"
                                >
                                    ← Torna indietro
                                </button>

                                <h1 className="recipe-detail-title">{selectedRecipe.name}</h1>
                                <p className="recipe-detail-category">{selectedRecipe.category}</p>

                                <div className="recipe-detail-grid">
                                    <div className="recipe-detail-item">
                                        <div className="recipe-detail-item-label">Persone</div>
                                        <div className="recipe-detail-item-value">{selectedRecipe.servings}</div>
                                    </div>
                                    <div className="recipe-detail-item">
                                        <div className="recipe-detail-item-label">Tempo</div>
                                        <div className="recipe-detail-item-value">{selectedRecipe.time}</div>
                                    </div>
                                    <div className="recipe-detail-item">
                                        <div className="recipe-detail-item-label">Difficoltà</div>
                                        <div className="recipe-detail-item-value">{selectedRecipe.difficulty}</div>
                                    </div>
                                </div>

                                {selectedRecipe.notes && (
                                    <div className="recipe-detail-notes">
                                        <p><strong>💡 Nota:</strong> {selectedRecipe.notes}</p>
                                    </div>
                                )}

                                <div className="recipe-detail-section">
                                    <h2 className="recipe-detail-section-title">📋 Ingredienti</h2>
                                    <ul className="recipe-ingredients">
                                        {selectedRecipe.ingredients.map((ing, idx) => (
                                            <li key={idx}>✓ {ing}</li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="recipe-detail-section recipe-steps">
                                    <h2 className="recipe-detail-section-title">👨‍🍳 Procedimento</h2>
                                    <ol>
                                        {selectedRecipe.steps.map((step, idx) => (
                                            <li key={idx}>
                                                <strong>Passo {idx + 1}:</strong> {step}
                                            </li>
                                        ))}
                                    </ol>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RicettarioApp />);
    </script>
</body>
</html>
