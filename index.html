<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Ricettario di Husqui</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Noto Serif JP', serif;
        }

        /* Background pattern orientale */
        .oriental-bg {
            background: linear-gradient(135deg, #faf8f6 0%, #f5f1ea 50%, #ede5d9 100%);
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .oriental-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(217, 119, 6, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Stile header elegante */
        .header-container {
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .header-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(217, 119, 6, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(239, 68, 68, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .header-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: #faf8f6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .header-title-secondary {
            font-size: 3rem;
            font-weight: 700;
            color: #faf8f6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .decorative-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #d97706, transparent);
            margin: 16px auto;
        }

        .header-subtitle {
            font-size: 1.1rem;
            color: #d4af86;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Main container */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 50px 20px;
            position: relative;
            z-index: 5;
        }

        /* Barra di ricerca elegante */
        .search-section {
            margin-bottom: 50px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #d9a880;
            font-size: 1.2rem;
            z-index: 2;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 2px solid #d9a880;
            border-radius: 8px;
            background: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .search-input:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.15);
            background: #fffbf0;
        }

        /* Titolo categorie */
        .categories-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        /* Grid categorie */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        @media (min-width: 768px) {
            .categories-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Cartelle categoria */
        .category-folder {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #fff5e6 0%, #fef0d9 100%);
            border: 2px solid #d9a880;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.1);
        }

        .category-folder::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .category-folder:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 30px rgba(217, 119, 6, 0.2);
            background: linear-gradient(135deg, #fef0d9 0%, #fee5cc 100%);
            border-color: #d97706;
        }

        .category-folder:hover::before {
            opacity: 1;
        }

        .category-folder-number {
            font-size: 4rem;
            font-weight: 700;
            color: #d97706;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 1;
        }

        /* Info box */
        .info-box {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-left: 4px solid #d97706;
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .info-box-text {
            text-align: center;
            color: #555;
            font-size: 1rem;
        }

        .info-box-highlight {
            color: #d97706;
            font-weight: 600;
        }

        /* Animazioni */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title {
                font-size: 2.5rem;
            }

            .header-title-secondary {
                font-size: 2rem;
            }

            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .category-folder-number {
                font-size: 3rem;
            }

            .header-subtitle {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        function RicettarioApp() {
            const [searchTerm, setSearchTerm] = useState("");

            const categories = [
                { id: 1, name: "1" },
                { id: 2, name: "2" },
                { id: 3, name: "3" },
                { id: 4, name: "4" },
                { id: 5, name: "5" },
                { id: 6, name: "6" },
                { id: 7, name: "7" },
                { id: 8, name: "8" }
            ];

            return (
                <div className="oriental-bg" style={{ background: 'linear-gradient(135deg, #faf8f6 0%, #f5f1ea 50%, #ede5d9 100%)' }}>
                    {/* Header */}
                    <div className="header-container">
                        <div className="header-content">
                            <h1 className="header-title">IL RICETTARIO</h1>
                            <h2 className="header-title-secondary">DI HUSQUI</h2>
                            <div className="decorative-line"></div>
                            <p className="header-subtitle">Collezione di ricette tradizionali e raffinate</p>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="main-content">
                        {/* Search Bar */}
                        <div className="search-section">
                            <div className="search-container">
                                <span className="search-icon">🔍</span>
                                <input
                                    type="text"
                                    placeholder="Cerca le tue ricette..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="search-input"
                                />
                            </div>
                        </div>

                        {/* Categories Title */}
                        <h3 className="categories-title">Le tue categorie</h3>

                        {/* Categories Grid */}
                        <div className="categories-grid">
                            {categories.map((cat) => (
                                <div
                                    key={cat.id}
                                    className="category-folder"
                                >
                                    <div className="category-folder-number">{cat.name}</div>
                                </div>
                            ))}
                        </div>

                        {/* Info Box */}
                        <div className="info-box">
                            <p className="info-box-text">
                                <span className="info-box-highlight">✨ Benvenuto nel ricettario</span>
                                <br />
                                Usa la barra di ricerca per trovare le tue ricette oppure clicca su una categoria per esplorare
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RicettarioApp />);
    </script>
</body>
</html>
