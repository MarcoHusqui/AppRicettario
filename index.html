        function RicettarioApp() {
            const [ricette, setRicette] = useState(RICETTE_DATA);
            const [ricettaSelezionata, setRicettaSelezionata] = useState(null);
            const [filtroCategoria, setFiltroCategoria] = useState("Tutti");

            const categorie = ["Tutti", ...new Set(ricette.map(r => r.categoria))];
            const ricetteFiltr = filtroCategoria === "Tutti" 
                ? ricette 
                : ricette.filter(r => r.categoria === filtroCategoria);

            return (
                <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-orange-600 to-red-600 text-white py-8 px-4 shadow-lg">

                        <p className="text-center mt-2 text-orange-100">Ricette buone e facili da fare</p>
                    </div>

                    <div className="max-w-6xl mx-auto p-4">
                        {!ricettaSelezionata ? (
                            <>
                                {/* Filtri */}
                                <div className="flex gap-2 overflow-x-auto py-6 px-2 -mx-2">
                                    {categorie.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setFiltroCategoria(cat)}
                                            className={`px-4 py-2 rounded-full whitespace-nowrap font-semibold transition-all ${
                                                filtroCategoria === cat
                                                    ? "bg-orange-600 text-white shadow-lg"
                                                    : "bg-white text-gray-700 border-2 border-orange-200"
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                {/* Grid Ricette */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-8">
                                    {ricetteFiltr.map(ricetta => (
                                        <div
                                            key={ricetta.id}
                                            onClick={() => setRicettaSelezionata(ricetta)}
                                            className="bg-white rounded-lg shadow-md hover:shadow-2xl transition-all cursor-pointer overflow-hidden hover:scale-105 transform"
                                        >
                                            {ricetta.immagine && (
                                                <img 
                                                    src={ricetta.immagine} 
                                                    alt={ricetta.nome}
                                                    className="w-full h-48 object-cover"
                                                />
                                            )}
                                            <div className="p-4">
                                                <h3 className="text-xl font-bold text-gray-800">{ricetta.nome}</h3>
                                                <p className="text-sm text-orange-600 font-semibold">{ricetta.categoria}</p>
                                                <div className="flex gap-4 mt-3 text-sm text-gray-600">
                                                    <span>⏱️ {ricetta.tempo}</span>
                                                    <span>📊 {ricetta.difficolta}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            /* Dettaglio Ricetta */
                            <div className="bg-white rounded-lg shadow-lg p-6 md:p-8">
                                <button
                                    onClick={() => setRicettaSelezionata(null)}
                                    className="mb-6 px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 transition-all"
                                >
                                    ← Torna alle ricette
                                </button>

                                <div className="grid md:grid-cols-2 gap-8">
                                    {ricettaSelezionata.immagine && (
                                        <img 
                                            src={ricettaSelezionata.immagine}
                                            alt={ricettaSelezionata.nome}
                                            className="w-full h-80 object-cover rounded-lg shadow-md"
                                        />
                                    )}
                                    
                                    <div>
                                        <h1 className="text-4xl font-bold text-gray-800 mb-2">{ricettaSelezionata.nome}</h1>
                                        <p className="text-orange-600 text-lg mb-4">{ricettaSelezionata.categoria}</p>
                                        
                                        <div className="grid grid-cols-3 gap-4 mb-6">
                                            <div className="bg-orange-100 p-3 rounded-lg">
                                                <div className="text-orange-600 text-sm font-semibold">Tempo</div>
                                                <div className="text-lg font-bold">{ricettaSelezionata.tempo}</div>
                                            </div>
                                            <div className="bg-orange-100 p-3 rounded-lg">
                                                <div className="text-orange-600 text-sm font-semibold">Difficoltà</div>
                                                <div className="text-lg font-bold">{ricettaSelezionata.difficolta}</div>
                                            </div>
                                            <div className="bg-orange-100 p-3 rounded-lg">
                                                <div className="text-orange-600 text-sm font-semibold">Ingredienti</div>
                                                <div className="text-lg font-bold">{ricettaSelezionata.ingredienti.length}</div>
                                            </div>
                                        </div>

                                        {ricettaSelezionata.note && (
                                            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
                                                <p className="text-sm text-gray-700"><strong>💡 Nota:</strong> {ricettaSelezionata.note}</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="mt-8">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-4">📋 Ingredienti</h2>
                                    <ul className="grid md:grid-cols-2 gap-3">
                                        {ricettaSelezionata.ingredienti.map((ing, idx) => (
                                            <li key={idx} className="flex items-center gap-3 p-2 bg-orange-50 rounded">
                                                <span className="text-orange-600 font-bold">✓</span>
                                                <span>{ing}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                {/* Procedimento */}
                                <div className="mt-8">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-4">👨‍🍳 Procedimento</h2>
                                    <ol className="space-y-3">
                                        {ricettaSelezionata.procedimento.map((step, idx) => (
                                            <li key={idx} className="flex gap-4 p-4 bg-gray-50 rounded-lg">
                                                <span className="text-orange-600 font-bold text-lg min-w-fit">Passo {idx + 1}</span>
                                                <span className="text-gray-700">{step}</span>
                                            </li>
                                        ))}
                                    </ol>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RicettarioApp />);
    </script>
